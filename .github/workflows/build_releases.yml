name: Build and Release Ford-Fulkerson Simulator

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag / Versión (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux ZIP
        run: |
          cd build/linux/x64/release
          zip -r ../../../../Ford-Fulkerson-Simulator-Linux.zip bundle

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ford-Fulkerson-Simulator-Linux
          path: Ford-Fulkerson-Simulator-Linux.zip
          retention-days: 1

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Ford-Fulkerson-Simulator-Windows.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ford-Fulkerson-Simulator-Windows
          path: Ford-Fulkerson-Simulator-Windows.zip
          retention-days: 1

  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../Ford-Fulkerson-Simulator-macOS.zip "Ford-Fulkerson Simulator.app"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ford-Fulkerson-Simulator-macOS
          path: Ford-Fulkerson-Simulator-macOS.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Ford-Fulkerson Simulator ${{ steps.tag_info.outputs.tag }}"
          body: |
            ## Ford-Fulkerson Simulator - Release Binaries 🚀

            Interactive maximum flow and minimum cut simulator built with Flutter and Rust.

            ### Standalone Executable Downloads:
            * **Windows**: `Ford-Fulkerson-Simulator-Windows.zip` (extract and run `Ford-Fulkerson-Simulator.exe`)
            * **macOS**: `Ford-Fulkerson-Simulator-macOS.zip` (extract and open `Ford-Fulkerson Simulator.app`)
            * **Linux**: `Ford-Fulkerson-Simulator-Linux.zip` (extract and run `./bundle/ford-fulkerson-simulator`)
          draft: false
          prerelease: false
          files: |
            Ford-Fulkerson-Simulator-Linux.zip
            Ford-Fulkerson-Simulator-Windows.zip
            Ford-Fulkerson-Simulator-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
